<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학습 대시보드 | AeroSchool FAA A&P</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F172A;--panel:#13203b;--panel2:#1a2a4a;--cyan:#60A5FA;--gold:#FBBF24;--green:#34D399;--red:#E0635A;--t1:#F1F5F9;--t2:#CBD5E1;--t3:#7c8db0;--line:rgba(96,165,250,.18);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--t1);font-family:'Noto Sans KR',sans-serif;line-height:1.6;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:1020px;margin:0 auto;padding:34px 22px 80px;}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px;}
.top a.home{color:var(--cyan);font-weight:700;font-size:13.5px;}
h1{font-size:30px;font-weight:900;margin:6px 0 2px;}
.sub{font-family:'JetBrains Mono',monospace;color:var(--t3);font-size:12.5px;margin-bottom:22px;}
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
@media(max-width:760px){.hero{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 14px;text-align:center;}
.stat b{display:block;font-family:'Space Grotesk',sans-serif;font-size:28px;line-height:1.15;}
.stat span{font-size:12px;color:var(--t3);}
.stat.know b{color:var(--green);} .stat.again b{color:var(--red);}
.stat.quiz b{color:var(--cyan);} .stat.rate b{color:var(--gold);}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px;}
.btn{display:inline-block;font-weight:700;font-size:14px;border-radius:10px;padding:11px 18px;border:1px solid rgba(96,165,250,.4);background:rgba(96,165,250,.12);color:var(--cyan);cursor:pointer;}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;}
.btn.ghost{background:transparent;color:var(--t3);border-color:var(--line);font-weight:500;}
.site{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:18px;overflow:hidden;}
.site-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);}
.site-h .ico{font-size:20px;}
.site-h h2{font-size:17px;font-weight:900;}
.site-h .mono{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--t3);margin-left:auto;}
.rows{padding:6px 0;}
.row{display:grid;grid-template-columns:200px 1fr 150px;gap:12px;align-items:center;padding:8px 18px;border-bottom:1px solid rgba(96,165,250,.06);}
.row:last-child{border-bottom:none;}
.row:hover{background:rgba(96,165,250,.04);}
.row .name{font-size:13.5px;font-weight:600;color:var(--t1);}
.row .name a:hover{color:var(--cyan);}
.bar{height:9px;border-radius:5px;background:rgba(148,163,184,.15);overflow:hidden;display:flex;}
.bar .k{background:var(--green);height:100%;} .bar .a{background:var(--red);height:100%;}
.row .nums{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--t3);text-align:right;white-space:nowrap;}
.row .nums .k{color:var(--green);} .row .nums .a{color:var(--red);} .row .nums .q{color:var(--cyan);}
.row.dim .name, .row.dim .nums{color:var(--t3);opacity:.65;}
.legend{font-size:11.5px;color:var(--t3);padding:10px 18px 14px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;vertical-align:-1px;}
.extras{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 20px;}
@media(max-width:760px){.extras{grid-template-columns:1fr;}.row{grid-template-columns:130px 1fr 118px;}}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px;font-size:13px;color:var(--t2);}
.ex b{color:var(--gold);font-family:'Space Grotesk',sans-serif;}
.foot{margin-top:26px;font-size:12px;color:var(--t3);line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="home" href="index.html">← AeroSchool 홈</a></div>
  <h1>📊 학습 대시보드</h1>
  <div class="sub">GENERAL · AIRFRAME · POWERPLANT — 이 브라우저에 저장된 학습 기록 기준</div>

  <div class="hero">
    <div class="stat know"><b id="tKnow">0</b><span>구술 · 알았음</span></div>
    <div class="stat again"><b id="tAgain">0</b><span>구술 · 다시 볼 것</span></div>
    <div class="stat quiz"><b id="tQuiz">0</b><span>기출 풀이 문항</span></div>
    <div class="stat rate"><b id="tRate">–</b><span>기출 정답률</span></div>
  </div>

  <div class="actions">
    <a class="btn primary" href="review.html">🔄 복습 모드 시작 <span id="againBadge"></span></a>
    <button class="btn ghost" onclick="resetAll()">기록 초기화</button>
  </div>

  <div class="extras" id="extras"></div>
  <div id="sites"></div>

  <div class="foot">
    · 진행도는 이 브라우저(localStorage)에만 저장됩니다. 다른 기기와 공유되지 않습니다.<br>
    · "미기록" 챕터는 한 번 방문하면 총 문항 수가 집계되기 시작합니다.
  </div>
</div>

<script>
var SITES=[
 {id:'general',ico:'📘',name:'General',ch:{
  ch01_intro_aviation:'항공 입문·인적요인',ch02_mathematics:'항공 수학',ch03_basic_physics:'기초 물리',
  ch04_basic_electricity:'기초 전기',ch05_aircraft_drawings:'항공기 도면',ch06_weight_balance:'무게와 평형',
  ch07_materials_processes:'재료와 공정',ch08_corrosion_control:'세척·부식방지',ch09_fluid_lines:'유체 라인·피팅',
  ch10_ground_operation:'지상 운용',ch11_regulations:'규정과 간행물',ch12_privileges:'정비사 권한·한계',
  ch13_forms_records:'정비 기록·서식',ch14_tools:'정비 공구',ch15_entering_field:'취업 입문'}},
 {id:'airframe',ico:'✈️',name:'Airframe',ch:{
  ch01_aircraft_structures:'항공기 구조',ch02_aerodynamics_rigging:'공기역학·리깅',ch03_fabric_covering:'천 외피',
  ch04_metal_repair:'판금 수리',ch05_welding:'용접',ch06_wood_structure:'목재·투명플라스틱',ch07_composites:'복합재',
  ch08_painting:'도장·마감',ch09_electrical:'전기계통',ch10_instruments:'계기계통',ch11_comm_nav:'통신·항법',
  ch12_hydraulic_pneumatic:'유압·공압',ch13_landing_gear:'착륙장치',ch14_fuel_systems:'연료계통',
  ch15_ice_rain:'방빙·제빙',ch16_cabin_environment:'객실환경',ch17_fire_protection:'화재방지',ch18_inspection:'검사'}},
 {id:'powerplant',ico:'⚙️',name:'Powerplant',ch:{
  ch01_aircraft_engines:'항공기 엔진',ch02_fuel_systems:'연료·연료계량',ch03_induction_exhaust:'흡기·배기',
  ch04_ignition_electrical:'점화·전기',ch05_starting_systems:'시동계통',ch06_lubrication_cooling:'윤활·냉각',
  ch07_propellers:'프로펠러',ch08_engine_removal:'엔진 장탈착·보존',ch09_fire_protection:'화재방지',
  ch10_maintenance_operation:'정비·운용',ch11_lsa_engines:'경량기(LSA) 엔진',
  ch12_turbine_engines:'가스터빈 엔진'}}
];
function readJSON(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function counts(obj){
  var kn=0,ag=0,tot=null;
  if(obj){for(var k in obj){if(k==='__t'){tot=obj[k];continue;}if(k.indexOf('__')===0)continue;
    if(obj[k]==='know')kn++; else if(obj[k]==='again')ag++;}}
  return {know:kn,again:ag,total:tot};
}
function quizCounts(obj){
  var ok=0,no=0,tot=null;
  if(obj){for(var k in obj){if(k==='__t'){tot=obj[k];continue;}if(k.indexOf('__')===0)continue;
    if(obj[k]===1)ok++; else if(obj[k]===0)no++;}}
  return {ok:ok,no:no,tot:tot};
}
var TK=0,TA=0,TQ=0,TQok=0;
var html='';
SITES.forEach(function(s){
  var rows='';var sk=0,sa=0,sq=0,sqok=0;
  for(var cid in s.ch){
    var path='/'+s.id+'/'+cid+'.html';
    var o=counts(readJSON('orx:'+path));
    var q=quizCounts(readJSON('iq:'+path));
    var visited=(o.total!==null)||(q.tot!==null);
    sk+=o.know; sa+=o.again; sq+=q.ok+q.no; sqok+=q.ok;
    var tot=o.total||0, kn=o.know, ag=o.again;
    var kp=tot?Math.round(kn/tot*100):0, ap=tot?Math.round(ag/tot*100):0;
    var qtxt=(q.ok+q.no)?('<span class="q">기출 '+q.ok+'/'+(q.ok+q.no)+'</span>'):'';
    rows+='<div class="row'+(visited?'':' dim')+'">'
      +'<div class="name"><a href="'+s.id+'/'+cid+'.html">'+s.ch[cid]+'</a></div>'
      +'<div class="bar"><div class="k" style="width:'+kp+'%"></div><div class="a" style="width:'+ap+'%"></div></div>'
      +'<div class="nums">'+(visited?('<span class="k">✅'+kn+'</span> <span class="a">🔄'+ag+'</span>/'+ (tot||'?') +' '+qtxt):'미기록')+'</div>'
      +'</div>';
  }
  TK+=sk;TA+=sa;TQ+=sq;TQok+=sqok;
  html+='<div class="site"><div class="site-h"><span class="ico">'+s.ico+'</span><h2>'+s.name+'</h2>'
    +'<span class="mono">구술 ✅'+sk+' · 🔄'+sa+(sq?(' · 기출 '+sqok+'/'+sq):'')+'</span></div>'
    +'<div class="rows">'+rows+'</div>'
    +'<div class="legend">구술 진행 바:<i style="background:var(--green)"></i>알았음<i style="background:var(--red)"></i>다시</div></div>';
});
document.getElementById('sites').innerHTML=html;
document.getElementById('tKnow').textContent=TK;
document.getElementById('tAgain').textContent=TA;
document.getElementById('tQuiz').textContent=TQ;
document.getElementById('tRate').textContent=TQ?Math.round(TQok/TQ*100)+'%':'–';
document.getElementById('againBadge').textContent=TA?('('+TA+'문항)'):'';

// 기존 트레이너·오답노트 요약
(function(){
  function cnt(v){if(!v)return 0;if(Array.isArray(v))return v.length;
    if(typeof v==='object'){var n=0;for(var k in v){if(v[k])n++;}return n;}return 0;}
  var ex='';
  var gw=readJSON('gen_wrong'); if(cnt(gw)) ex+='<div class="ex">📘 General 모의고사 오답노트 <b>'+cnt(gw)+'</b>문항 — <a href="general/mock_exam.html" style="color:var(--cyan)">다시 풀기 →</a></div>';
  var go=readJSON('gen_oral'); if(cnt(go)) ex+='<div class="ex">📘 General ACS 구술 트레이너 진행 <b>'+cnt(go)+'</b>건 — <a href="general/practical_acs.html" style="color:var(--cyan)">이어하기 →</a></div>';
  var ak=readJSON('af_acs_known'); if(cnt(ak)) ex+='<div class="ex">✈️ Airframe ACS 트레이너 알았음 <b>'+cnt(ak)+'</b>건 — <a href="airframe/practical_acs.html" style="color:var(--cyan)">이어하기 →</a></div>';
  document.getElementById('extras').innerHTML=ex;
})();

function resetAll(){
  if(!confirm('구술·기출 학습 기록(orx/iq)을 모두 지울까요?\n모의고사 오답노트 등 다른 기록은 유지됩니다.'))return;
  var del=[];
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
    if(k.indexOf('orx:')===0||k.indexOf('iq:')===0)del.push(k);}
  del.forEach(function(k){localStorage.removeItem(k);});
  location.reload();
}
</script>
</body>
</html>
